name: Build davinci kernel (dead-amp workaround)

# Triggers automatically on push so no manual "Run workflow" click is needed.
on:
  push:
    branches: [main]
    paths:
      - "davinci-amp-workaround.patch"
      - ".github/workflows/build-davinci-kernel.yml"
  workflow_dispatch:

jobs:
  build:
    # 22.04 keeps glibc/binutils compatible with the LineageOS clang-12 prebuilt
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo (patch lives here)
        uses: actions/checkout@v4

      - name: Clone LineageOS kernel source (lineage-23.2)
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel
          cd kernel
          git log --oneline -1

      - name: Apply dead-amp workaround
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = 'techpack/audio/asoc/sm6150.c'
          src = open(p).read()
          old = ('\t\t\t\t\tmsm_mi2s_be_dai_links[0].codec_name = "tfa98xx.3-0034";\n'
                 '\t\t\t\t\tmsm_mi2s_be_dai_links[0].codec_dai_name = "tfa98xx-aif-3-34";')
          new = ('\t\t\t\t\t/* dead-amp workaround: TFA98xx does not answer on I2C,\n'
                 '\t\t\t\t\t * bind the always-present stub codec so the sound card\n'
                 '\t\t\t\t\t * can still register (headset/earpiece/BT keep working).\n'
                 '\t\t\t\t\t */\n'
                 '\t\t\t\t\tmsm_mi2s_be_dai_links[0].codec_name = "msm-stub-codec.1";\n'
                 '\t\t\t\t\tmsm_mi2s_be_dai_links[0].codec_dai_name = "msm-stub-rx";')
          n = src.count(old)
          assert n == 1, f"expected exactly 1 match, got {n} - source layout changed upstream"
          open(p, 'w').write(src.replace(old, new))
          print("patch applied OK")
          PYEOF
          echo "=== resulting diff ==="
          git diff --stat
          git diff | head -40

      - name: Install build deps and LineageOS clang-12 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p tc
          curl -fL --retry 3 \
            "https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C tc --strip-components=1
          ./tc/bin/clang --version

      - name: Configure (sdmsteppe-perf_defconfig + davinci fragment)
        run: |
          cd kernel
          export PATH=$PWD/../tc/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_ARGS vendor/sdmsteppe-perf_defconfig
          # apply the device fragment on top (last occurrence wins, then olddefconfig)
          cat arch/arm64/configs/vendor/davinci.config >> out/.config
          make $MAKE_ARGS olddefconfig
          echo "=== config sanity ==="
          grep -E "CONFIG_MACH_XIAOMI_DAVINCI|CONFIG_SND_SOC_MSM_STUB|CONFIG_TARGET_PRODUCT_K9A|CONFIG_SND_SOC_TAS2563|CONFIG_SND_SOC_AWINIC" out/.config || true
          echo "=== mi2s dailink defaults in source ==="
          grep -n -A2 "msm_mi2s_be_dai_links\[\] = {" techpack/audio/asoc/sm6150.c | head -5

      - name: Build Image.gz
        run: |
          cd kernel
          export PATH=$PWD/../tc/bin:$PATH
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)" Image.gz
          ls -l out/arch/arm64/boot/Image.gz

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: davinci-Image.gz
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/.config
          if-no-files-found: error
          retention-days: 14
